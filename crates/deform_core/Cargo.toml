[package]
name = "deform_core"
version = "0.1.0"
edition = "2021"     # for solana compat

[lib]
crate-type = ["rlib"]

[dependencies]
deform_derive = { path = "../deform_derive" }
tokio = { workspace = true, features = ["sync"], optional = true }
serde = { workspace = true }
solana-program-error = { workspace = true }
wincode = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
solana-address = { workspace = true }

[features]
default = ["client"]
client = ["dep:tokio"]
