[package]
name = "shooter"
version = "0.1.0"
edition = "2024"

[lib]

[[bin]]
name = "shooter"
required-features = ["bin"]

[features]
default = ["client", "server", "anchor"]
# offline should not be in bin, server does not need it. No FoC here: the avian/tnua
# simulation cannot run inside an SBF program, so a fully-on-chain lobby could never
# tick — see the note in physics_sim.rs.
bin = ["dep:clap", "deform_core/client", "dep:deform_offline", "dep:anyhow", "dep:solana-sdk", "dep:solana-client", "dep:solana-rpc-client", "dep:serde_json", "dep:deform_quic", "dep:tokio", "dep:tokio-util", "dep:tracing", "dep:tracing-subscriber", "dep:magicblock-magic-program-api", "physics"]
server = ["bin"]
client = ["bin", "dep:bevy_egui", "dep:bevy-egui-notify", "bevy/default", "bevy/dynamic_linking", "dep:egui-probe", "deform_core/egui-probe"]
anchor = ["dep:anchor-lang", "solana-address/borsh", "deform_core/anchor"]
# Like pong's, minus deform_foc (the shooter has no FoC backend). tracy-client with
# default features is what actually enables the Tracy client at runtime.
tracy = ["dep:tracy-client", "deform_quic/tracy", "deform_core/tracy"]
# The avian + tnua simulation. Everything that runs `advance_frame` (client, server,
# offline) needs it. The SBF build of the anchor program cannot have it, which is why
# the program depends on this crate with default-features = false + `anchor` only.
physics = ["dep:bevy", "dep:avian3d", "dep:bevy-tnua", "dep:bevy-tnua-avian3d"]

[dependencies]
anchor-lang = { workspace = true, optional = true }
deform_core = { path = "../../deform_core" }
deform_offline = { path = "../../deform_offline", optional = true }
glam = { workspace = true }
serde = { workspace = true }
wincode = { workspace = true }
# Deliberately not the workspace dep: the headless sim (and therefore the server)
# only needs bevy's core + assets, so a server build skips windowing/audio/render
# entirely. The `client` feature turns the full engine back on via `bevy/default`.
bevy = { version = "0.19.0", default-features = false, features = ["bevy_asset", "multi_threaded"], optional = true }
# default features pull mesh/scene/picking integrations that expect a rendering
# app; the headless sim world only needs the parry colliders
avian3d = { version = "0.7", optional = true, default-features = false, features = ["3d", "f32", "parry-f32", "parallel"] }
bevy-tnua = { version = "0.32", optional = true }
bevy-tnua-avian3d = { version = "0.12", optional = true }
bevy_egui = { workspace = true, optional = true }
bevy-egui-notify = { workspace = true, optional = true }
solana-address = { workspace = true, features = ["decode"] }
solana-instruction = { workspace = true }
solana-sdk = { workspace = true, optional = true }
solana-client = { workspace = true, optional = true }
solana-rpc-client = { workspace = true, optional = true }
anyhow = { version = "1.0.102", optional = true }
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
deform_quic = { path = "../../deform_quic", optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
borsh = { workspace = true }
egui-probe = { workspace = true, optional = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
solana-account-info = { workspace = true }
solana-cpi = { workspace = true }
solana-program-error = { workspace = true }
solana-system-interface = { workspace = true }
ephemeral-rollups-sdk = { workspace = true }
tracy-client = { workspace = true, optional = true, default-features = true }
# Matches the version ephemeral-rollups-sdk 0.15.5 pins, so the ScheduleTask/pubkey
# types unify. default-features off keeps it on the modern (non backward-compat) API.
magicblock-magic-program-api = { version = "0.10.1", default-features = false, optional = true }
