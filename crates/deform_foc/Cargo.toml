[package]
name = "deform_foc"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
metrics = ["dep:deform_metrics", "deform_core/metrics"]

[dependencies]
anyhow = { workspace = true }
deform_core = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "net", "macros"] }
tokio-util = { workspace = true }
futures-util = "0.3"
better_tokio_select = { workspace = true }
# raw WebSocket: one accountSubscribe connection for the lobby, one for our inputs.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
solana-address = { workspace = true }
solana-signature = { workspace = true }
solana-rpc-client = { workspace = true }
solana-sdk = { workspace = true }
wincode = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }
deform_metrics = { workspace = true, optional = true }
