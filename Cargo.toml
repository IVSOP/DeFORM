[workspace]
resolver = "3"
members = [
    "deform_core",
    "deform_quic",
]
exclude = [

]

[workspace.dependencies]
wincode = { version = "0.5.4", default-features = false, features = ["alloc", "std", "derive"] }
solana-program-error = "3.0.1"
solana-address = { version = "2.6.0", features = ["wincode"] }
solana-client = "3.1.4"
serde = { version = "1.0.228", features = ["serde_derive"] }
tokio = { version = "1.48.0", features = ["full"] }
solana-sdk = { version = "3.0.0", default-features = false, features = ["full", "solana-signature"] } # "borsh"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = { version = "0.26" }
glam = { version = "0.30.7", default-features = false, features = ["bytemuck", "std", "serde"] } # debug-glam-assert
thiserror = "2.0.18"
better_tokio_select = "0.2"
